[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-dedup-tool"
version = "2.0.0"
description = "高效桌面端数据查重与多表处理程序：支持 Word/Excel/CSV/TXT 多格式导入、多模式智能编码识别、双列表覆盖率与缺漏对比、多表跨表查重与合并、SQLite 毫秒级索引及多格式报表导出"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "yellowdking" },
]
dependencies = [
    "PySide6-Essentials>=6.7.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.10.0",
    "Pillow>=10.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.10.0",
    "Pillow>=10.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
