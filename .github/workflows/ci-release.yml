name: CI & Windows Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'release-line' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test, Build & Smoke-Test Windows EXE
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.release_check.outputs.should_release }}
      release_tag: ${{ steps.release_check.outputs.release_tag }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      QT_QPA_PLATFORM: "offscreen"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Verify tag matches pyproject.toml version (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = (python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])").Trim()
          if ("v$ver" -ne $tag) {
            Write-Error "Tag '$tag' does not match pyproject.toml version 'v$ver'."
            exit 1
          }
          Write-Host "Verified tag $tag matches pyproject.toml version $ver."

      - name: Install runtime and build/test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8.0.0" "pyinstaller>=6.10.0" "Pillow>=10.0.0"

      - name: Generate application icon
        shell: pwsh
        run: |
          if (Test-Path "src\ui\icon_gen.py") {
            python -m src.ui.icon_gen
          }

      - name: Run unit and headless UI tests
        shell: pwsh
        run: |
          pytest -v

      - name: Build single-file Windows executable
        shell: pwsh
        run: |
          python scripts/build_exe.py --skip-smoke-test

      - name: Frozen EXE smoke test (offscreen)
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $asciiExe = "dist\data-dedup-tool.exe"
          if (-not (Test-Path $asciiExe)) {
            Write-Error "Executable not found: $asciiExe"
            exit 1
          }
          $tmpDataDir = Join-Path $env:RUNNER_TEMP "dedup_ci_smoke"
          if (Test-Path $tmpDataDir) { Remove-Item $tmpDataDir -Recurse -Force }
          New-Item -ItemType Directory -Path $tmpDataDir -Force | Out-Null
          $env:QT_QPA_PLATFORM = "offscreen"
          & $asciiExe --smoke-test --data-dir $tmpDataDir
          $exitCode = $LASTEXITCODE
          Remove-Item $tmpDataDir -Recurse -Force -ErrorAction SilentlyContinue
          if ($exitCode -ne 0) {
            Write-Error "Frozen EXE --smoke-test failed with exit code $exitCode"
            exit $exitCode
          }
          Write-Host "Frozen EXE --smoke-test passed (exit code 0)."

      - name: Verify EXE metadata and prepare release assets + SHA256SUMS
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $asciiExe = "dist\data-dedup-tool.exe"
          $item = Get-Item $asciiExe
          if ($item.Length -lt 10MB) {
            Write-Error "Executable size is unexpectedly small: $($item.Length) bytes"
            exit 1
          }
          python -c "import ctypes, sys; s = ctypes.windll.version.GetFileVersionInfoSizeW(r'dist\data-dedup-tool.exe', None); print(f'Verified PE VersionInfo size: {s} bytes'); sys.exit(0 if s > 0 else 1)"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Built EXE is missing Windows PE VSVersionInfo metadata."
            exit 1
          }
          Copy-Item $asciiExe "dist\data-dedup-tool-windows-x64.exe" -Force
          python -c "import zipfile; zf = zipfile.ZipFile('dist/data-dedup-tool-windows-x64.zip', 'w', compression=zipfile.ZIP_DEFLATED); zf.write('dist/data-dedup-tool.exe', arcname='\u6570\u636e\u67e5\u91cd\u7a0b\u5e8f.exe'); zf.close()"

          $assets = @(
            "dist\data-dedup-tool-windows-x64.exe",
            "dist\data-dedup-tool-windows-x64.zip"
          )
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $asset).Hash.ToLowerInvariant()
            $name = Split-Path -Leaf $asset
            "$hash  $name"
          }
          [System.IO.File]::WriteAllLines((Resolve-Path "dist").Path + "\SHA256SUMS.txt", $lines, (New-Object System.Text.UTF8Encoding($false)))

          $zipItem = Get-Item "dist\data-dedup-tool-windows-x64.zip"
          Write-Host ("Verified EXE: {0} ({1:N2} MB)" -f $item.Name, ($item.Length / 1MB))
          Write-Host ("Verified ZIP: {0} ({1:N2} MB)" -f $zipItem.Name, ($zipItem.Length / 1MB))
          Write-Host "SHA256SUMS.txt:"
          Get-Content "dist\SHA256SUMS.txt"

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: data-dedup-tool-windows-exe
          path: |
            dist/data-dedup-tool-windows-x64.exe
            dist/data-dedup-tool-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Check version tag for automatic release
        id: release_check
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          $refName = "${{ github.ref_name }}"

          if ($ref.StartsWith("refs/tags/v")) {
            Write-Host "Triggered by tag push: $refName"
            "should_release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "release_tag=$refName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } elseif ($ref -eq "refs/heads/main") {
            $ver = (python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])").Trim()
            if ([string]::IsNullOrWhiteSpace($ver)) {
              Write-Error "Failed to read project version from pyproject.toml"
              exit 1
            }
            $tag = "v$ver"
            git fetch --tags --quiet
            $existing = (git tag -l $tag)
            if ([string]::IsNullOrWhiteSpace($existing)) {
              Write-Host "Tag $tag does not exist yet; will publish Release $tag."
              "should_release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              "release_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            } else {
              Write-Host "Tag $tag already exists; skipping automatic release."
              "should_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              "release_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            }
          } else {
            Write-Host "Not a main push or v* tag ($ref); skipping release."
            "should_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "release_tag=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

  release:
    name: Publish GitHub Release
    needs: test-and-build
    if: needs.test-and-build.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built release assets
        uses: actions/download-artifact@v4
        with:
          name: data-dedup-tool-windows-exe
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.test-and-build.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: "数据查重程序 ${{ needs.test-and-build.outputs.release_tag }}"
          generate_release_notes: true
          body: |
            ### 下载说明
            - **`data-dedup-tool-windows-x64.exe`**：Windows 64 位单文件免安装可执行程序，下载后双击即可运行。
            - **`data-dedup-tool-windows-x64.zip`**：内含中文文件名 `数据查重程序.exe`，适合直接解压使用。
            - **`SHA256SUMS.txt`**：发行文件的 SHA-256 完整性校验值。

            > **便携模式**：在程序同级目录下新建空文件 `portable.flag`，即可将配置与数据库保存在程序旁的 `user_data/` 目录中随身携带。
            >
            > **Windows SmartScreen 提示**：本开源发行包未购买商业代码签名证书，首次运行如遇系统提示，点击「更多信息」->「仍要运行」即可，亦可对照 `SHA256SUMS.txt` 校验文件完整性。
          files: |
            dist/data-dedup-tool-windows-x64.exe
            dist/data-dedup-tool-windows-x64.zip
            dist/SHA256SUMS.txt
